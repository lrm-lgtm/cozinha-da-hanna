<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Cozinha da Hanna 🍕</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap');
:root{--mint:#d8f8df;--green:#258465;--dark:#284e43;--cream:#fffaf0;--edge:#ead8bc;--coral:#ee886e;--yellow:#ffca70}
*{box-sizing:border-box}
html{background:#fff7e8;min-height:100%}
body{margin:0;min-height:100dvh;color:#46544a;font-family:Nunito,system-ui,sans-serif;font-weight:800;background:radial-gradient(circle at 10% 8%,#c8f8e6,transparent 30%),radial-gradient(circle at 95% 95%,#ffe3a9,transparent 31%),#fff9eb}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #168add;outline-offset:2px}
.app{width:min(1450px,100%);margin:auto;min-height:100dvh;padding:16px 19px;display:flex;flex-direction:column;gap:13px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px}
.brand-icon{width:58px;height:58px;border-radius:21px;background:#fff;border:3px solid #f9d893;display:grid;place-items:center;font-size:31px;box-shadow:0 5px 0 #f0d0a5;transform:rotate(-5deg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.14}
h1{font-size:clamp(25px,3.3vw,39px);color:var(--dark)}
.brand small{display:block;color:#ad7c53;text-transform:uppercase;font-size:11px;letter-spacing:1.2px;font-weight:900}
.controls{display:flex;align-items:center;gap:8px}
.score,.iconbtn{background:#fffefa;border:2px solid var(--edge);height:46px;border-radius:16px;box-shadow:0 4px 0 #efdfc9;color:#3a7863}
.score{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:20px}
.iconbtn{width:46px;font-size:22px}
.progress{background:#fffefa;border:2px solid #efdfc6;border-radius:19px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:8px 18px;color:#708377;font-size:13px}
.steps{display:flex;align-items:center;gap:9px}
.steps span{display:flex;align-items:center;gap:4px;opacity:.57}
.steps span strong{display:grid;place-items:center;background:#f2eedf;color:#87978b;border-radius:50%;width:26px;height:26px}
.steps span.on{opacity:1;color:#286f57}.steps span.on strong{background:#bde9cb;color:#226c57}
.steps span.done{opacity:1;color:#36956c}.steps span.done strong{background:#36956c;color:white}
.game-layout{display:grid;grid-template-columns:minmax(220px,.82fr) minmax(350px,1.68fr) minmax(268px,1.1fr);gap:15px;flex:1;align-items:stretch}
.panel{border:2px solid var(--edge);border-radius:28px;background:#fffefa;box-shadow:0 8px 0 #c6a97b12,0 20px 40px #655c4014;overflow:hidden;min-width:0}
.guest{background:linear-gradient(#fff9ec 0 80%,#ffe3b9 80%);padding:19px 15px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:420px}
.lamp{font-size:11px;color:#b47757;letter-spacing:.8px;align-self:flex-start}
.speech{width:100%;background:white;border:2px solid #e9d6c2;border-radius:21px;padding:18px 13px;text-align:center;box-shadow:0 5px 0 #ecd9c1;margin-top:auto;position:relative}
.speech:after{content:"";position:absolute;width:15px;height:15px;bottom:-9px;left:calc(50% - 8px);background:white;border-bottom:2px solid #e9d6c2;border-right:2px solid #e9d6c2;transform:rotate(45deg)}
.speech strong{display:block;font-size:12px;color:#e67d61;letter-spacing:.5px;margin-bottom:6px}
.speech p{font-size:clamp(14px,1.25vw,18px);color:#425346;line-height:1.4}
.avatar{font-size:clamp(92px,10vw,150px);height:190px;display:grid;place-items:center;filter:drop-shadow(0 14px 2px #ae87572c)}
.speak{border:2px solid #edceae;border-radius:14px;padding:9px 14px;background:#fff9ee;color:#ad7750;font-size:12px}
.stage{background:repeating-linear-gradient(0deg,#fffdf8 0 54px,#f5eee1 55px 56px);display:flex;flex-direction:column;min-height:545px}
.stagehead{text-align:center;padding:26px 16px 12px}
.eyebrow{display:inline-block;background:#e4f7e8;border-radius:50px;color:#298b6a;padding:4px 12px;font-size:11px;letter-spacing:.9px}
.stagehead h2{color:#244f42;font-size:clamp(26px,3vw,38px);margin:8px 0 2px}
.stagehead p{color:#87958c;font-size:13px}
.stagebody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;gap:12px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;width:100%}
.choice{background:#fff9e9;border:3px solid #eedbc2;border-radius:24px;min-height:214px;padding:12px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 7px 0 #ead8bb}
.choice:hover{border-color:#f9c785;transform:translateY(-2px)}
.choice:active{transform:translateY(4px)}
.choice .emoji{font-size:clamp(52px,5.5vw,82px);line-height:1.1}
.choice b{font-family:'Baloo 2',system-ui;font-size:17px;color:#405a49}
.choice small{font-size:10px;color:#a58464}
.message{text-align:center;font-size:13px;min-height:22px;color:#6a8c72}
.panhead{padding:18px 16px 12px;background:#fff8eb;border-bottom:2px dashed #eadbc7}
.panhead small{font-size:11px;color:#b47c55}
.panhead h3{font-size:25px;color:#34584b}
.panhead p{font-size:12px;color:#8e998e;margin-top:4px}
.pantryinner{padding:13px}
.pantrycards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.ingredient{min-width:0;min-height:83px;border:2px solid #ebdbc5;border-radius:15px;background:#fffaf0;box-shadow:0 5px 0 #edddc8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;touch-action:none;user-select:none;cursor:grab}
.ingredient:hover{border-color:#f5c379;background:#fff4d9}
.ingredient .emoji{font-size:34px;pointer-events:none;line-height:1}
.ingredient .label{font-weight:900;font-size:12px;pointer-events:none}
.ingredient.placed{background:#e0f8e8;border-color:#8cdab1;box-shadow:0 4px 0 #c2ead0;cursor:default}
.ingredient.placed:after{content:"✓";position:absolute;right:5px;top:4px;font-size:12px;background:#40aa79;color:white;border-radius:50%;width:19px;height:19px;display:grid;place-items:center}
.ingredient.dragging{opacity:.35}
.ingredient.wrong{animation:shake .3s}
.ingredient:disabled{opacity:.8}
.receipt{border:2px dashed #e3ceae;background:white;border-radius:17px;margin-top:16px;padding:12px}
.receipt-top{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:#ae9878}
.receipt h3{font-size:19px;color:#325e4d;margin:8px 0}
.need-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.need{background:#fff9ed;border:1px solid #eee3d4;border-radius:10px;padding:5px;display:flex;align-items:center;gap:5px;font-size:10px}
.need i{font-style:normal;font-size:19px}
.need.check{background:#e4f8e9;border-color:#bae6c5;color:#27724f}
.order-help{text-align:center;padding:23px 15px;color:#9c8768;font-size:16px;line-height:1.5}
.order-help .paper{margin:5px auto 14px;border-radius:15px;border:2px dashed #e8d7b6;padding:26px;font-size:65px;background:#fffaf1}
#plateHost{width:100%;max-width:100%}.plate-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:320px}
.plate-label{background:#e6f6e8;color:#348266;border-radius:30px;font-size:12px;padding:5px 12px}
.plate{width:min(290px,95%);aspect-ratio:1/1;position:relative;border-radius:50%;background:radial-gradient(circle at 43% 35%,#fff 0 53%,#e5f1e9 54% 62%,#fff 63% 68%,#c7dbd0 69% 72%,#fff 73%);border:7px solid #fff;box-shadow:0 12px 0 #45655718,0 17px 25px #53604d20;transition:box-shadow .14s,transform .14s;display:grid;place-items:center}
.plate:before{content:"";position:absolute;inset:11%;border:2px dotted #d6e9dd;border-radius:50%}
.plate.hover{transform:scale(1.035);box-shadow:0 0 0 9px #a8eabd,0 12px 0 #45655718,0 20px 28px #53604d20}
.drop-hint{position:absolute;z-index:5;background:#f9fff4;border:2px solid #b4d9bd;border-radius:50px;padding:5px 10px;font-size:10px;color:#327f60;bottom:8%;pointer-events:none}
.plate.hover .drop-hint{background:#2d9c75;color:white}
.plate-art{position:absolute;inset:14%;display:grid;place-items:center;pointer-events:none;transition:opacity .2s}
.plate-art.ghost{opacity:.14;filter:grayscale(1)}
.pizza-dough{position:relative;width:100%;height:100%;border-radius:50%;border:12px solid #d49b55;background:radial-gradient(circle at 30% 26%,#fadd9a 0,#eac178 82%);box-shadow:inset 0 0 0 7px #efcf8f,inset -11px -9px 0 #dba96a,0 5px 0 #d1a16b}
.pizza-dough:before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 68% 28%,#ed9c71 2%,transparent 12%),radial-gradient(circle at 33% 62%,#efac6f 2%,transparent 14%),radial-gradient(circle at 50% 50%,#f6b779,#efa46d)}
.pizza-dough:after{content:"";position:absolute;width:14%;height:5%;left:16%;top:22%;background:#fff0bd;border-radius:50%;transform:rotate(-30deg);opacity:.7}
.burger-art{width:95%;height:65%;border-radius:50% 50% 27% 27%;background:linear-gradient(#df9859 0 14%,#f2c477 16% 36%,#5aaf68 38% 43%,#8f4c36 47% 69%,#f6c879 71% 84%,#d88d50 87%);box-shadow:0 7px 0 #cb975c;transform:rotate(-6deg)}
.sandwich-art{width:95%;height:85%;background:linear-gradient(140deg,#f8d8a5 0 43%,#a6ce80 44% 52%,#f4be7c 53%);clip-path:polygon(50% 4%,99% 92%,1% 92%);filter:drop-shadow(0 6px 1px #c48f55)}
.icecream-art{width:70%;height:87%;background:linear-gradient(#f9a9c5 0 27%,#f6e8c9 27% 38%,#f4c379 39%);clip-path:polygon(5% 12%,95% 12%,60% 100%,40% 100%);border-radius:38% 38% 0 0}
.salad-art{width:92%;height:92%;border-radius:50%;background:radial-gradient(circle at 25% 23%,#b9e88a 0 14%,transparent 15%),radial-gradient(circle at 72% 66%,#79bd66 0 24%,transparent 25%),radial-gradient(circle,#a2d977 10%,#4aa461 82%);box-shadow:0 5px 0 #99bdb0}
.pancake-art{width:95%;height:70%;border-radius:50%;background:linear-gradient(#f4d28b 0 36%,#b67645 39% 47%,#f2c679 50% 70%,#ba7949 75% 85%,#f3cf81 86%);box-shadow:0 8px 0 #c58e58}
.topping{position:absolute;z-index:3;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 2px 1px #684e3222)}
.topping.emoji{font-size:clamp(21px,2.8vw,35px)}
.topping.cheese{width:18%;height:12%;background:#ffe66d;border:2px solid #ffd056;border-radius:48% 35% 45% 41%;transform:translate(-50%,-50%) rotate(25deg)}
.topping.cheese:after{content:"";position:absolute;inset:30% 37%;border-radius:50%;background:#f6bd40;opacity:.6}
.topping.tomato{width:14%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#f0715c 18%,#d94439 24% 72%,#ba3833 75%);border:2px solid #f6876e;box-shadow:inset 0 0 0 3px #f36550}
.topping.corn{width:10%;height:7%;border-radius:50%;background:#ffd54a;box-shadow:inset 0 -3px 0 #dca037}
.topping-area{position:absolute;inset:0;pointer-events:none}
.footer{display:flex;justify-content:space-between;align-items:center;gap:11px;padding:10px 15px;background:#fffdf7;border:2px solid var(--edge);border-radius:19px;min-height:70px}
.tip{font-size:13px;color:#759080;max-width:63%}
.actions{display:flex;gap:8px;align-items:center}
.primary,.secondary{border-radius:15px;min-height:45px;padding:8px 17px;font-weight:900;white-space:nowrap}
.primary{font-family:'Baloo 2',system-ui,sans-serif;background:#2c9c75;border:0;color:white;font-size:19px;box-shadow:0 5px 0 #1b7558}
.primary:disabled{background:#a9c9b6;box-shadow:0 5px 0 #8fae9b;cursor:not-allowed}
.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #1b7558}
.secondary{border:2px solid #e9d3b7;color:#ad8058;background:#fff7e9;font-size:12px}
.drag-proxy{position:fixed;z-index:1000;transform:translate(-50%,-50%) rotate(-8deg);pointer-events:none;font-size:59px;filter:drop-shadow(0 8px 5px #0003)}
.toast{position:fixed;z-index:2001;top:75px;left:50%;transform:translate(-50%,-13px);max-width:min(450px,95vw);background:white;border:3px solid #c8ecd4;box-shadow:0 10px 30px #234b3533;border-radius:18px;padding:13px 19px;text-align:center;font-size:14px;color:#2c775b;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warning{border-color:#f4beaa;color:#af6753}
.overlay{position:fixed;inset:0;z-index:3000;background:#17392c9c;display:grid;place-items:center;padding:15px;backdrop-filter:blur(4px)}
.overlay[hidden]{display:none}
.modal{background:#fffdf5;border:5px solid white;border-radius:32px;box-shadow:0 20px 0 #23423355,0 35px 65px #0003;padding:29px 20px;text-align:center;max-width:535px;width:100%;max-height:95dvh;overflow:auto}
.modal .big{font-size:78px}
.modal h2{font-size:clamp(29px,5vw,44px);color:#285b46;margin:6px 0 10px}
.modal p{font-size:16px;color:#819080;line-height:1.5;margin:0 auto 19px;max-width:420px}
.modal .steps-guide{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:15px 0 22px}
.steps-guide span{background:#f6e8d3;color:#927b58;font-size:12px;border-radius:10px;padding:7px}
.stars{font-size:43px;letter-spacing:4px;margin:8px}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media(max-width:1050px){.game-layout{grid-template-columns:minmax(170px,.75fr) minmax(300px,1.5fr) minmax(220px,1fr);gap:9px}.plate{width:min(250px,100%)}.plate-zone{min-height:275px}.ingredient{min-height:74px}.guest{padding:13px}.stage{min-height:520px}}

body.mode-order .game-layout{grid-template-columns:1fr;grid-template-areas:"guest" "stage"}
body.mode-order .stage{position:relative;min-height:310px}

}

</style>

['burger','Hambúrguer de queijo e alface','Um hambúrguer com queijo e alface!',['pao','carne','queijo','alface']],
['burger','Hambúrguer com tomate','Quero hambúrguer com tomate e queijo!',['pao','carne','tomate','queijo']],
['sorvete','Sorvete de morango e banana','Um sorvete com morango e banana!',['casquinha','morango','banana']],
['sorvete','Sorvete com chocolate','Quero sorvete com chocolate e confeitos!',['casquinha','chocolate','confeitos']],
['salada','Salada de tomate e pepino','Uma salada com alface, tomate e pepino!',['alface','tomate','pepino']],
['salada','Salada de cenoura e milho','Quero salada com alface, cenoura e milho!',['alface','cenoura','milho']],
['panqueca','Panqueca com banana e mel','Uma panqueca com banana e mel, por favor!',['panqueca','banana','mel']],
['panqueca','Panqueca com morango','Quero panqueca de morango com chocolate!',['panqueca','morango','chocolate']],
['sanduiche','Sanduíche de queijo e tomate','Um sanduíche de queijo e tomate!',['pao','queijo','tomate']],
['sanduiche','Sanduíche de ovo e alface','Quero sanduíche com ovo e alface!',['pao','ovo','alface']],
['frutas','Taça de frutas com morango','Para sobremesa, quero uma taça de frutas com morango, banana e mel!',['tigela','morango','banana','mel']],
['frutas','Taça de frutas com chocolate','Para sobremesa, quero taça de frutas com banana, morango e chocolate!',['tigela','banana','morango','chocolate']]
];
const names=['Nina','Sofia','Theo','Bia','Lili','Davi','Pedro'];
const faces=['👧🏽','👧🏻','👦🏽','👧🏿','👧🏼','👦🏻','👦🏼'];
const S={round:0,course:'main',stage:'order',stars:0,placed:[],deck:[],guests:[],palette:[],sound:true,locked:false,clientStars:0,ratings:[],activeRequest:'',prepStarted:0,mission:null,progress:{}};
const dessertTypes=['sorvete','panqueca','frutas'];
const isDessert=()=>S.course==='dessert';
const foodIcon=id=>window.FoodArt?window.FoodArt.ingredient(id):ingredients[id][1];
const dishIcon=id=>window.FoodArt?(window.FoodArt.dish(id)||window.FoodArt.ingredient(dishes[id][2])):dishes[id][1];
let drag=null,toastTimer=0,audio=null;
function sample(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));let z=a[i];a[i]=a[j];a[j]=z;}return a;}
function order(){return S.deck[S.round];}
const Missions=window.HannaMissions;
const SAVE_KEY='hanna_missions_v1';
try{S.progress=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')||{};}catch(e){S.progress={};}
function saveMissionProgress(){
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(S.progress));}catch(e){snack('Não foi possível salvar o progresso neste navegador.',true);}
}
const specialTypes={torrada:'torrada',omelete:'omelete'};
function missionOrder(recipeId){
 const r=Missions.recipes[recipeId];
 if(!r)throw Error('Receita inexistente: '+recipeId);
 const type=specialTypes[recipeId]||r.art;
 const sweet=type==='sorvete'||(type==='frutas'&&S.mission.chapter!=='manha')||(type==='panqueca'&&S.mission.chapter==='doce');
 return [type,r.label,'Quero '+r.label.toLowerCase()+', por favor!',r.needs.slice(),sweet?'dessert':'main'];
}
function activeMission(){
 const last=Missions.missions.find(m=>Missions.unlocked(m.id,S.progress)&&!S.progress[m.id]?.completed);
 return last||Missions.missions[Missions.missions.length-1];
}
function selectMission(id){
 const m=Missions.get(id);
 if(!m||!Missions.unlocked(id,S.progress))return;
 window.HannaVoice.cancel();
 S.mission=m;
 hide();
 start();
}
function missionMenu(){
 window.HannaVoice.cancel();
 const groups=Missions.chapters.map(ch=>{
  const cards=ch.missions.map(m=>{
    const unlocked=Missions.unlocked(m.id,S.progress),p=S.progress[m.id];
    const mark=p?.completed?('⭐'.repeat(p.stars||0)||'✓'):unlocked?'JOGAR':'🔒';
    return '<button class="mission-pick '+(unlocked?'':'locked')+'" data-mission-id="'+m.id+'" '+(unlocked?'':'disabled')+'><small>'+ch.icon+' MISSÃO '+(m.index+1)+'</small><b>'+m.title+'</b><span>'+mark+'</span></button>';
  }).join('');
  return '<section class="mission-group"><h3>'+ch.title+'</h3><div class="mission-choices">'+cards+'</div></section>';
 }).join('');
 show('<h2 id="modalTitle">Pedidos e missões</h2><p>A cada missão, os pedidos ficam mais variados. Tudo acontece neste mesmo restaurante.</p><div class="mission-list">'+groups+'</div><div class="mission-menu-actions"><button class="secondary" id="closeMissionMenu">Voltar ao restaurante</button></div>');
 $('closeMissionMenu').onclick=hide;
 document.querySelectorAll('[data-mission-id]').forEach(b=>{b.onclick=()=>selectMission(b.dataset.missionId);});
}
function dish(){return dishes[order()[0]];}
function snack(t,warn){const x=$('toast');x.textContent=t;x.className='toast show'+(warn?' warning':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.className='toast',2500);}
function sfx(kind){if(!S.sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let melody=kind==='wrong'?[220,185]:kind==='win'?[523,659,784]:[440,587];melody.forEach((v,i)=>{const osc=audio.createOscillator(),gain=audio.createGain(),start=audio.currentTime+i*.09;osc.type='sine';osc.frequency.value=v;gain.gain.setValueAtTime(.001,start);gain.gain.exponentialRampToValueAtTime(.055,start+.018);gain.gain.exponentialRampToValueAtTime(.001,start+.17);osc.connect(gain);gain.connect(audio.destination);osc.start(start);osc.stop(start+.18);});}catch(e){}}
function say(text){
 if(!S.sound)return;
 const p=window.HannaVoice.profile(S.guests[S.round][0],S.round);
 const result=window.HannaVoice.speak(text,p,{enabled:S.sound});
 if(result.reason==='unsupported')snack('Seu navegador não oferece leitura em voz alta.',true);
}
function speak(){say(S.activeRequest||order()[2]);}
function rating(){
 const wanted=order()[3],correct=S.placed.filter(id=>wanted.includes(id)).length;
 const wrong=S.placed.length-correct,missing=wanted.length-correct;
 const score=Math.max(0,Math.round(100*correct/wanted.length-24*wrong));
 const stars=score>=85?3:score>=60?2:score>=30?1:0;
 const level=score>=85?'excellent':score>=60?'good':score>=30?'okay':'low';
 const elapsed=Math.max(1,Math.round((performance.now()-S.prepStarted)/1000));
 const response=window.HannaVoice.feedback({level,score,correct,wrong,missing,elapsed,course:S.course});
 return {score,stars,correct,wrong,missing,elapsed,level,response};
}
function show(html){$('overlay').innerHTML='<div class="modal">'+html+'</div>';$('overlay').hidden=false;}
function hide(){$('overlay').hidden=true;$('overlay').innerHTML='';}
function header(){let idx=['order','prepare','serve'].indexOf(S.stage);if(idx<0)idx=2;$('round').textContent='MISSÃO '+(Missions.missions.indexOf(S.mission)+1)+'/24 · PEDIDO '+(S.round+1)+'/'+S.deck.length;$('score').textContent=S.stars;$('progressText').textContent=S.stage==='order'?(isDessert()?'🍨 Sobremesa':'📝 Anote o pedido'):S.stage==='prepare'?(isDessert()?'🍓 Prepare a sobremesa':'🍳 Prepare o prato'):'🎉 Prontinho!';$('steps').innerHTML=['Pedido','Preparar','Servir'].map((t,i)=>'<span class="'+(i===idx?'on':i<idx?'done':'')+'"><strong>'+(i<idx?'✓':(i+1))+'</strong>'+t+'</span>').join('');$('request').textContent='“'+(S.activeRequest||order()[2])+'”';$('customerName').textContent=S.guests[S.round][0].toUpperCase()+' DIZ:';$('avatar').innerHTML=window.FoodArt?window.FoodArt.person(S.round):S.guests[S.round][1];document.body.className='mode-'+S.stage+(isDessert()?' course-dessert':'');}
function stageHead(tag,title,sub){return '<div class="stagehead"><span class="eyebrow">'+tag+'</span><h2>'+title+'</h2><p>'+sub+'</p></div>';}
function renderOrder(){S.stage='order';S.placed=[];S.locked=false;S.activeRequest=window.HannaVoice.request(order()[2],S.course,S.guests[S.round][0]);header();let type=order()[0];let pool=isDessert()?['sorvete','panqueca','frutas']:['pizza','burger','salada','sanduiche','torrada','omelete','panqueca','frutas'];let choices=sample([type].concat(sample(pool.filter(x=>x!==type)).slice(0,2)));$('stageContent').innerHTML=stageHead(isDessert()?'🍧 SOBREMESA • ANOTAR':'📝 PRATO PRINCIPAL • ANOTAR',isDessert()?'Qual sobremesa foi pedida?':'Qual prato foi pedido?','Escolha pela imagem e anote a comanda.')+'<div class="stagebody"><div class="choices">'+choices.map(k=>'<button type="button" class="choice" data-dish="'+k+'"><span class="emoji">'+dishIcon(k)+'</span><b>'+dishes[k][0]+'</b><small>ANOTAR PEDIDO</small></button>').join('')+'</div><p class="message" id="message">Confira a comanda e escolha com atenção.</p></div>';$('pantry').innerHTML='<div class="panhead"><small>📒 CADERNINHO</small><h3>Anote o pedido</h3><p>Escute e escolha o prato.</p></div><div class="order-help"><div class="paper">📝</div>O pedido aparece quando você escolher o prato!</div>';$('tip').textContent='Ouça o cliente e escolha o prato!';$('actions').innerHTML='<button class="secondary" id="hear">🔊 Ouvir de novo</button>';$('hear').onclick=speak;document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{if(S.stage!=='order'||S.locked)return;if(btn.dataset.dish!==type){sfx('wrong');$('message').textContent='Quase! Tente outro prato. 💛';btn.style.borderColor='#efa88e';return;}S.locked=true;btn.style.borderColor='#68c99a';$('message').textContent='Pedido anotado! ✨';sfx('good');setTimeout(renderPrepare,420);}));}
const coords=[[33,33],[65,34],[47,52],[32,66],[67,66],[50,22],[51,77],[75,49]];
function drawToken(id,n){const isPizza=order()[0]==='pizza';let points=coords.slice(0,6);let bits=[];if(isPizza&&(id==='queijo'||id==='tomate'||id==='milho')){let css=id==='queijo'?'cheese':id==='tomate'?'tomato':'corn';points.forEach((xy,i)=>{bits.push('<span class="topping '+css+'" style="left:'+xy[0]+'%;top:'+xy[1]+'%;'+(id==='queijo'?'transform:translate(-50%,-50%) rotate('+(i*36)+'deg)':'')+'"></span>');});}else{let xy=coords[(n+1)%coords.length];bits.push('<span class="topping vector" style="left:'+xy[0]+'%;top:'+xy[1]+'%">'+foodIcon(id)+'</span>');}return bits.join('');}
function plateHTML(){let base=dish()[2],has=S.placed.includes(base),type=order()[0];let art=type==='pizza'?'<div class="pizza-dough"></div>':foodIcon(base);return '<div class="plate-zone"><span class="plate-label">'+(isDessert()?'SOBREMESA: ':'PRATO: ')+dish()[0].toUpperCase()+'</span><div class="plate" id="plate" aria-label="Prato: solte um ingrediente aqui"><div class="plate-art'+(has?'':' ghost')+'">'+art+'</div><div class="topping-area">'+S.placed.filter(id=>id!==base).map((id,i)=>drawToken(id,i)).join('')+'</div><span class="drop-hint" id="dropHint">'+(has?'SOLTE AQUI!':'COMECE PELA BASE')+'</span></div></div>';}
function recipe(){
 const wanted=order()[3],right=S.placed.filter(id=>wanted.includes(id)),wrong=S.placed.filter(id=>!wanted.includes(id));
 return '<div class="receipt"><div class="receipt-top"><span>COMANDA #'+String(S.round+1).padStart(2,'0')+'</span><span>'+S.guests[S.round][0].toUpperCase()+'</span></div><h3>'+order()[1]+'</h3><div class="need-list">'+wanted.map(id=>'<div class="need '+(right.includes(id)?'check':'')+'"><i>'+foodIcon(id)+'</i>'+ingredients[id][0]+(right.includes(id)?' ✓':'')+'</div>').join('')+'</div><p class="recipe-progress">'+right.length+' de '+wanted.length+' ingredientes pedidos'+(wrong.length?' • '+wrong.length+' diferente'+(wrong.length>1?'s':''):'')+'</p></div>';
}
function renderPrepare(){S.stage='prepare';S.placed=[];S.locked=false;S.prepStarted=performance.now();let rest=sample(Object.keys(ingredients).filter(id=>!order()[3].includes(id))).slice(0,8-order()[3].length);S.palette=sample(order()[3].concat(rest));header();$('stageContent').innerHTML=stageHead(isDessert()?'🍓 SOBREMESA • PREPARAR':'🍳 PRATO PRINCIPAL • PREPARAR',isDessert()?'Monte a sobremesa!':'Monte o prato!','Arraste os ingredientes da despensa até o prato.')+'<div class="stagebody"><div id="plateHost">'+plateHTML()+'</div><p class="message" id="message">Comece pelo '+ingredients[dish()[2]][0].toLowerCase()+'! 🌈</p></div>';$('pantry').innerHTML='<div class="panhead"><small>🍓 DESPENSA</small><h3>Ingredientes</h3><p>Segure e arraste até o prato!</p></div><div class="pantryinner"><div class="pantrycards">'+S.palette.map(id=>'<button type="button" class="ingredient" data-id="'+id+'" title="Arraste '+ingredients[id][0]+' para o prato" aria-label="Arrastar '+ingredients[id][0]+' para o prato"><span class="emoji">'+foodIcon(id)+'</span><span class="label">'+ingredients[id][0]+'</span></button>').join('')+'</div><div id="recipe">'+recipe()+'</div></div>';$('tip').textContent='Pode inventar: a avaliação depende dos ingredientes certos e errados.';$('actions').innerHTML='<button class="secondary" id="clear">↻ Limpar</button><button class="primary" id="serve" disabled>Servir 🍽️</button>';$('clear').onclick=()=>{S.placed=[];update();sfx('good');};$('serve').onclick=serve;document.querySelectorAll('.ingredient').forEach(b=>{b.addEventListener('pointerdown',startDrag);b.addEventListener('click',e=>{if(e.detail===0)add(b.dataset.id);});});update();}
function update(){
 if(S.stage!=='prepare')return;
 $('plateHost').innerHTML=plateHTML();
 $('recipe').innerHTML=recipe();
 document.querySelectorAll('.ingredient').forEach(b=>{
   const used=S.placed.includes(b.dataset.id);
   b.classList.toggle('placed',used);b.disabled=used;
 });
 const ready=S.placed.length>0;
 $('serve').disabled=!ready;
 const good=S.placed.filter(id=>order()[3].includes(id)).length;
 const bad=S.placed.length-good;
 $('message').textContent=good+' correto'+(good===1?'':'s')+' • '+bad+' diferente'+(bad===1?'':'s');
}
function add(id){
 if(S.stage!=='prepare'||S.placed.includes(id))return;
 S.placed.push(id);
 sfx(order()[3].includes(id)?'good':'wrong');
 update();
 if(!order()[3].includes(id))snack('Ingrediente adicionado. O cliente vai avaliar o resultado!',true);
}
function insidePlate(x,y){const el=$('plate');if(!el)return false;let r=el.getBoundingClientRect();return x>=r.left-18&&x<=r.right+18&&y>=r.top-18&&y<=r.bottom+18;}
function startDrag(e){let b=e.currentTarget;if(b.disabled||S.stage!=='prepare')return;if(e.pointerType==='mouse'&&e.button!==0)return;drag={id:b.dataset.id,startX:e.clientX,startY:e.clientY,pointer:e.pointerId,el:b,moving:false,proxy:null};try{b.setPointerCapture(e.pointerId);}catch(err){}}
function moveDrag(e){if(!drag||e.pointerId!==drag.pointer)return;let d=drag;if(!d.moving&&Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>8){d.moving=true;d.el.classList.add('dragging');d.proxy=document.createElement('div');d.proxy.className='drag-proxy';d.proxy.innerHTML=foodIcon(d.id);document.body.appendChild(d.proxy);}if(d.moving){e.preventDefault();d.proxy.style.left=e.clientX+'px';d.proxy.style.top=e.clientY+'px';const p=$('plate');if(p)p.classList.toggle('hover',insidePlate(e.clientX,e.clientY));}}
function releaseDrag(e){if(!drag||e.pointerId!==drag.pointer)return;const d=drag;drag=null;d.el.classList.remove('dragging');if(d.proxy)d.proxy.remove();let ok=d.moving&&insidePlate(e.clientX,e.clientY);let p=$('plate');if(p)p.classList.remove('hover');if(ok){add(d.id);}else if(d.moving){snack('Quase! Solte o ingrediente dentro do prato! 🍽️');}else{snack('Segure o ingrediente e arraste até o prato! 👆');}}
function cancelDrag(e){if(drag&&e.pointerId===drag.pointer){if(drag.proxy)drag.proxy.remove();drag.el.classList.remove('dragging');drag=null;let p=$('plate');if(p)p.classList.remove('hover');}}
window.addEventListener('pointermove',moveDrag,{passive:false});window.addEventListener('pointerup',releaseDrag);window.addEventListener('pointercancel',cancelDrag);
function serve(){
 if(S.stage!=='prepare'||S.placed.length===0)return;
 const result=rating();S.stage='serve';S.stars+=result.stars;S.ratings.push(result);header();
 if(result.stars>=2)sfx('win');else sfx('wrong');
 const faces={excellent:'😍',good:'🙂',okay:'😐',low:'😕'};
 const badge={excellent:'Adorou!',good:'Gostou',okay:'Mais ou menos',low:'Não gostou muito'};
 const last=S.round===S.deck.length-1;
 show('<div class="big">'+faces[result.level]+'</div><h2 id="modalTitle">'+badge[result.level]+'</h2><p class="reaction-text">“'+result.response+'”</p><div class="stars">'+('⭐'.repeat(result.stars)||'☆')+'</div><div class="rating-meter"><span style="width:'+result.score+'%"></span></div><p class="rating-details">'+result.score+'% de satisfação • '+result.correct+' certos • '+result.wrong+' diferentes • '+result.missing+' faltando • '+result.elapsed+'s</p><button class="secondary" id="repeatReaction">🔊 Ouvir avaliação</button><div style="margin-top:13px"><button class="primary" id="next">'+(last?'Concluir missão':'Próximo pedido →')+'</button></div>');
 $('repeatReaction').onclick=()=>say(result.response);
 $('next').onclick=()=>{window.HannaVoice.cancel();hide();if(last){finish();}else{S.round++;S.course=order()[4];renderOrder();}};
 say(result.response);
}
function finish(){
 const earned=Math.max(0,Math.min(3,Math.round(S.stars/S.deck.length)));
 const old=S.progress[S.mission.id]||{};
 S.progress[S.mission.id]={completed:true,stars:Math.max(old.stars||0,earned),lastPlayed:new Date().toISOString()};
 saveMissionProgress();
 const next=Missions.next(S.mission.id);
 const hasNext=next&&Missions.unlocked(next.id,S.progress);
 const nextBtn=hasNext?'<button class="primary" id="nextMission">Próxima missão →</button>':'<button class="primary" id="missionsAgain">Ver minhas missões</button>';
 show('<div class="big">🏆</div><h2 id="modalTitle">Missão concluída!</h2><p><b>'+S.mission.title+'</b><br>Você completou '+S.deck.length+' pedido'+(S.deck.length>1?'s':'')+' e conquistou '+S.stars+' estrelas!</p><div class="stars">'+('⭐'.repeat(earned)||'☆')+'</div><p>Uma nova missão fica disponível quando você termina a anterior.</p>'+nextBtn+'<div style="margin-top:13px"><button class="secondary" id="replayMission">Repetir missão</button> <button class="secondary" id="seeMissions">Escolher missão</button></div>');
 if(hasNext)$('nextMission').onclick=()=>selectMission(next.id);
 else $('missionsAgain').onclick=missionMenu;
 $('replayMission').onclick=()=>{hide();start();};
 $('seeMissions').onclick=missionMenu;
}
function start(){
 if(!S.mission)S.mission=activeMission();
 S.round=0;S.course='main';S.stars=0;S.placed=[];S.clientStars=0;S.ratings=[];S.activeRequest='';S.prepStarted=0;window.HannaVoice.reset();
 S.deck=S.mission.orders.map(missionOrder);
 S.guests=sample(names.map((name,i)=>[name,faces[i]])).slice(0,S.deck.length);
 S.course=order()[4];
 renderOrder();
}
$('speak').onclick=speak;
$('sound').onclick=()=>{S.sound=!S.sound;$('sound').textContent=S.sound?'🔊':'🔇';$('sound').title=S.sound?'Desativar falas e som':'Ativar falas e som';if(!S.sound)window.HannaVoice.cancel();};
$('restart').onclick=()=>{show('<div class="big">🍪</div><h2 id="modalTitle">Recomeçar?</h2><p>Quer recomeçar esta missão?</p><button class="primary" id="yes">Sim, vamos lá!</button><p style="margin-top:17px"><button class="secondary" id="no">Continuar jogando</button></p>');$('yes').onclick=()=>{hide();start();};$('no').onclick=hide;};
$('missionsMenu').onclick=missionMenu;
start();
show('<div class="big">👩‍🍳</div><h2 id="modalTitle">O restaurante da Hanna abriu!</h2><p>Agora os pedidos evoluem a cada missão. Comece com receitas simples, descubra novos ingredientes e atenda pedidos maiores sem sair deste restaurante!</p><div class="steps-guide"><span>👂 Ouça</span><span>📝 Anote</span><span>👆 Arraste</span><span>🍽️ Sirva!</span></div><button class="primary" id="play">Vamos cozinhar! ✨</button><div style="margin-top:15px"><button class="secondary" id="openMissionMenu">📋 Ver evolução dos pedidos</button></div>');$('play').onclick=()=>{hide();sfx('win');};$('openMissionMenu').onclick=missionMenu;
})();
</script>
</body>
</html>
