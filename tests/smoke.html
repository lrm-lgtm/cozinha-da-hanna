<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Teste integrado — pedidos da Hanna</title>
<body><pre id="result">RUNNING</pre><iframe id="game" src="../index.html" style="width:390px;height:844px;border:0"></iframe>
<script>
(async()=>{
const out=document.getElementById("result"),frame=document.getElementById("game");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fail=msg=>{out.textContent="FAIL: "+msg;throw Error(msg);};
await new Promise((ok,no)=>{frame.onload=ok;frame.onerror=no;});
const doc=frame.contentDocument,win=frame.contentWindow;
const D=win.HannaMissions;
if(!D||D.missions.length!==24||D.chapters.length!==6)fail("Catálogo com 24 pedidos não está integrado");
if(!doc.getElementById("missionsMenu"))fail("Menu de pedidos não apareceu");
if(doc.querySelector('a[href="missions.html"]'))fail("Link para segundo jogo ainda ativo");
if(!win.FoodArt||!win.HannaVoice)fail("Assets antigos foram perdidos");
const play=doc.getElementById("play");if(!play)fail("Tela inicial não carregou");play.click();
if(!doc.getElementById("round").textContent.includes("MISSÃO"))fail("Pedido atual não é missão");
function checkScroll(stage){
 const root=doc.documentElement,app=doc.querySelector(".app");
 if(root.scrollHeight>root.clientHeight+2)fail("Scroll externo em "+stage+" (root "+root.scrollHeight+"/"+root.clientHeight+")");
 if(app.scrollHeight>app.clientHeight+3)fail("Scroll no app em "+stage+" (app "+app.scrollHeight+"/"+app.clientHeight+")");
}
checkScroll("pedido");
doc.getElementById("missionsMenu").click();
const menu=doc.querySelector(".mission-list");
if(!menu||menu.querySelectorAll(".mission-pick").length!==24)fail("Lista de 24 missões ausente");
if(doc.querySelectorAll(".mission-pick:not([disabled])").length!==1)fail("Missões futuras não estão travadas");
doc.getElementById("closeMissionMenu").click();
let first=D.missions[0],recipe=D.recipes[first.orders[0]],type=recipe.art;
if(first.orders[0]==="torrada")type="torrada";
if(first.orders[0]==="omelete")type="omelete";
let choose=doc.querySelector('.choice[data-dish="'+type+'"]');
if(!choose)fail("Prato pedido não aparece na comanda "+type);
choose.click();await sleep(570);
if(!doc.getElementById("plate"))fail("Prato de montagem original ausente");
checkScroll("montagem");
for(const id of recipe.needs){
 let ingredient=doc.querySelector('.ingredient[data-id="'+id+'"]');
 if(!ingredient)fail("Ingrediente "+id+" não está na despensa");
 ingredient.click();
 if(!ingredient.disabled)fail("Ingrediente não foi adicionado ao prato: "+id);
}
const serve=doc.getElementById("serve");
if(!serve||serve.disabled)fail("Botão Servir indisponível");
serve.click();
if(!doc.getElementById("repeatReaction"))fail("Avaliação com voz não apareceu");
const next=doc.getElementById("next");if(!next)fail("Próximo pedido não aparece");
next.click();
if(!doc.getElementById("modalTitle")?.textContent.includes("Missão concluída"))fail("Missão não foi concluída");
const saved=JSON.parse(win.localStorage.getItem("hanna_missions_v1")||"{}");
if(!saved[first.id]?.completed)fail("Progresso da missão não foi salvo");
const nextMission=doc.getElementById("nextMission");if(!nextMission)fail("Não houve desbloqueio da segunda missão");
nextMission.click();
if(!doc.getElementById("round").textContent.includes("MISSÃO 2/24"))fail("Próxima missão não selecionada");
if(doc.querySelector(".play-layout"))fail("Segundo jogo ainda está renderizado");
for(const [w,h] of [[390,844],[375,667],[360,640],[1200,850],[1366,768]]){
 frame.style.width=w+"px";frame.style.height=h+"px";await sleep(40);checkScroll(w+"x"+h);
}
// Cobrir missões avançadas com dois pedidos na mesma tela, incluindo sobremesa.
const allDone={};
for(const m of D.missions.slice(0,16))allDone[m.id]={completed:true,stars:3};
win.localStorage.setItem("hanna_missions_v1",JSON.stringify(allDone));
const loaded=new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject;});
frame.src="../index.html";
await loaded;
const d=frame.contentDocument,w=frame.contentWindow,catalog=w.HannaMissions;
d.getElementById("play").click();
if(!d.getElementById("round").textContent.includes("MISSÃO 17/24"))fail("Não retomou os pedidos avançados");
async function serveAdvanced(recipeId){
 const data=catalog.recipes[recipeId];
 let kind=data.art;if(recipeId==="torrada"||recipeId==="omelete")kind=recipeId;
 const card=d.querySelector('.choice[data-dish="'+kind+'"]');
 if(!card)fail("Prato da missão avançada não apareceu: "+recipeId);
 card.click();await sleep(510);
 for(const id of data.needs){
  let ingredient=d.querySelector('.ingredient[data-id="'+id+'"]');
  if(!ingredient)fail("Ingrediente avançado ausente: "+id+" / "+recipeId);
  ingredient.click();
 }
 const btn=d.getElementById("serve");if(!btn||btn.disabled)fail("Não pode servir o pedido "+recipeId);
 btn.click();if(!d.getElementById("next"))fail("Avaliação ausente");
 d.getElementById("next").click();
}
await serveAdvanced("pizza_tomate");
if(!d.getElementById("round").textContent.includes("PEDIDO 2/2"))fail("Próximo pedido não continuou no mesmo restaurante");
await serveAdvanced("salada");
if(!d.getElementById("modalTitle")?.textContent.includes("Missão concluída"))fail("Missão com dois pedidos não terminou");
if(!JSON.parse(w.localStorage.getItem("hanna_missions_v1")||"{}")["lotado-01"]?.completed)fail("Missão dupla não foi salva");
const step=d.getElementById("nextMission");if(!step)fail("Missão seguinte não foi liberada");
step.click();
await serveAdvanced("burger_queijo");
if(!d.getElementById("round").textContent.includes("SOBREMESA")){/* Cabeçalho resume missão e pedido, não precisa conter a palavra. */}
if(!d.querySelector('.choice[data-dish="sorvete"]'))fail("Sobremesa não virou pedido no mesmo restaurante");
await serveAdvanced("sorvete_morango");
if(!d.getElementById("modalTitle")?.textContent.includes("Missão concluída"))fail("Missão com sobremesa não terminou");
out.textContent="PASS: missões integradas; 24 etapas; progresso; receitas duplas; sobremesa; layout em cinco resoluções";
})().catch(e=>document.getElementById("result").textContent="FAIL: "+(e.stack||e));
</script></body></html>
