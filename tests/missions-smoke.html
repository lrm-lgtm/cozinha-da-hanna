<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Teste de migração das missões</title>
<body><pre id="result">RUNNING</pre><iframe id="game" src="../missions.html" style="width:390px;height:844px;border:0"></iframe>
<script>
(async()=>{
const f=document.getElementById("game"),out=document.getElementById("result");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
await sleep(1000);
const d=f.contentDocument,w=f.contentWindow;
if(!w.location.pathname.endsWith("/index.html"))throw Error("Página separada não redireciona ao restaurante original: "+w.location.pathname);
if(!d.getElementById("missionsMenu"))throw Error("Menu integrado ausente");
if(!w.HannaMissions||w.HannaMissions.missions.length!==24)throw Error("Catálogo não carregou");
const play=d.getElementById("play");if(!play)throw Error("Restaurante não inicializou");play.click();
d.getElementById("missionsMenu").click();
if(d.querySelectorAll(".mission-pick").length!==24)throw Error("Missões não são listadas");
if(d.querySelector(".play-layout"))throw Error("Cenário separado continua ativo");
out.textContent="PASS: sem segundo jogo; link antigo redireciona; lista integrada com 24 missões";
})().catch(e=>document.getElementById("result").textContent="FAIL: "+(e.stack||e));
</script></body></html>
