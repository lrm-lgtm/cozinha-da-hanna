<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Regression test Pizza da Horta mission 7/24</title>
<body><pre id="result">RUNNING</pre><iframe id="game" src="../index.html" style="width:390px;height:844px;border:0"></iframe>
<script>
(async()=>{
const out=document.getElementById("result"),frame=document.getElementById("game");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fail=msg=>{out.textContent="FAIL: "+msg;throw Error(msg);};
const load=()=>new Promise((ok,no)=>{frame.onload=ok;frame.onerror=no;});
await load();
const catalog=frame.contentWindow.HannaMissions;
if(!catalog||catalog.missions[6]?.id!=="pizza-03")fail("Mission 7 was not pizza-03");
const progress={};for(const m of catalog.missions.slice(0,6)){progress[m.id]={completed:true,stars:3,lastPlayed:"2026-11-01T00:00:00Z"};}
frame.contentWindow.localStorage.setItem("hanna_missions_v1",JSON.stringify(progress));
const loadAgain=load();
frame.src="../index.html?test_mission_07=1";
await loadAgain;
const w=frame.contentWindow,d=frame.contentDocument;
let jsErrors=[];
w.addEventListener("error",e=>jsErrors.push(e.message));
w.addEventListener("unhandledrejection",e=>jsErrors.push(String(e.reason)));
const game=d.getElementById("round");
if(!game||!game.textContent.includes("MISSÃO 7/24"))fail("Reload did not resume 7/24: "+game?.textContent);
d.getElementById("play").click();
const card=d.querySelector('.choice[data-dish="pizza"]');
if(!card)fail("Pizza choice not present");card.click();
await sleep(550);
function checkAllInOne(size){
 const panel=d.getElementById("pantry"),inside=d.querySelector(".pantry-all-in-one");
 const receipt=d.getElementById("recipe"),grid=d.querySelector(".pantrycards");
 const cards=[...d.querySelectorAll(".pantrycards .ingredient")];
 if(!panel||!inside||!receipt||!grid)fail("Comanda e ingredientes nao compartilham o mesmo painel em "+size);
 if(cards.length!==6)fail("Painel deve mostrar 6 ingredientes sem scroll, recebeu "+cards.length+" em "+size);
 const within=(element,parent,name)=>{
  const r=element.getBoundingClientRect(),p=parent.getBoundingClientRect();
  if(r.width<10||r.height<12||r.left<p.left-2||r.right>p.right+2||r.top<p.top-2||r.bottom>p.bottom+2){
   fail(name+" fora da area visivel em "+size+" -> "+JSON.stringify({element:[r.left,r.top,r.right,r.bottom],parent:[p.left,p.top,p.right,p.bottom]}));
  }
 };
 within(receipt,inside,"Comanda");
 within(grid,inside,"Grade de ingredientes");
 for(const card of cards)within(card,grid,"Ingrediente "+card.dataset.id);
 for(const n of [panel,inside,grid]){
  if(n.scrollHeight>n.clientHeight+3)fail("Scroll interno em "+size+" "+(n.className||n.id)+" "+n.scrollHeight+"/"+n.clientHeight);
 }
 const root=d.documentElement,body=d.body;
 if(body.scrollHeight>root.clientHeight+3)fail("Scroll da pagina em "+size);
 const need=d.querySelectorAll(".receipt .need");
 if(need.length!==4)fail("Ingredientes pedidos nao aparecem na comanda em "+size);
}
for(const [width,height] of [[320,568],[360,640],[375,667],[390,844],[430,932],[768,720],[1024,768],[1366,768]]){
 frame.style.width=width+"px";frame.style.height=height+"px";
 await sleep(65);checkAllInOne(width+"x"+height);
}
frame.style.width="390px";frame.style.height="844px";await sleep(65);
const serving=d.getElementById("serve");
if(!serving)fail("Serve control absent");
const need=catalog.recipes.pizza_horta.needs;
if(need.join(",")!=="massa,tomate,milho,alface")fail("Unexpected recipe "+need);
if(serving.disabled)fail("SERVIR must respond even when dish empty");
serving.click();await sleep(35);
if(!d.getElementById("toast").textContent.includes("prato está vazio"))fail("Empty serve gave no feedback");
if(d.querySelector("#overlay:not([hidden]) #next"))fail("Empty plate was served");
for(const [i,id] of need.entries()){
 const b=d.querySelector('.ingredient[data-id="'+id+'"]');
 if(!b)fail("Ingredient "+id+" not available in the pantry");
 // Reproduce an actual mobile tap: pointer down/up without drag motion.
 const rect=b.getBoundingClientRect(),x=rect.left+rect.width/2,y=rect.top+rect.height/2;
 b.dispatchEvent(new w.PointerEvent("pointerdown",{bubbles:true,pointerType:"touch",pointerId:101+i,isPrimary:true,clientX:x,clientY:y}));
 b.dispatchEvent(new w.PointerEvent("pointerup",{bubbles:true,pointerType:"touch",pointerId:101+i,isPrimary:true,clientX:x,clientY:y}));
 await sleep(55);
 if(!b.disabled)fail("Touch did not add ingredient "+id);
}
if(serving.disabled)fail("SERVIR stayed disabled despite all four toppings");
const btnRect=serving.getBoundingClientRect();
const topElement=d.elementFromPoint(btnRect.left+btnRect.width/2,btnRect.top+btnRect.height/2);
if(!topElement?.closest("#serve"))fail("SERVIR button covered by another element on mobile: "+topElement?.outerHTML.slice(0,130));
serving.click();
await sleep(90);
if(jsErrors.length)fail("JS errors on serve: "+jsErrors.join("; "));
if(!d.querySelector("#overlay:not([hidden]) #next"))fail("Serving did not open reaction modal");
d.getElementById("next").click();
await sleep(100);
if(!d.getElementById("modalTitle")?.textContent.includes("Missão concluída"))fail("Did not finish mission 7");
if(!JSON.parse(w.localStorage.getItem("hanna_missions_v1")||"{}")["pizza-03"]?.completed)fail("Mission 7 not persisted");
if(!d.getElementById("nextMission"))fail("Mission 8 not unlocked");
d.getElementById("nextMission").click();
if(!d.getElementById("round").textContent.includes("MISSÃO 8/24"))fail("Mission 8 did not launch");
out.textContent="PASS: mission 7 pizza horta served, reaction, save, unlock 8";
})().catch(e=>document.getElementById("result").textContent="FAIL: "+(e.stack||e));
</script></body></html>
