<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe3">
<meta name="description" content="Cozinha da Hanna: 24 missões, seis capítulos e uma cozinha com etapas de preparo.">
<title>Missões da Chef Hanna 🍳</title>
<link rel="stylesheet" href="assets/missions.css">
</head>
<body>
<div class="mission-app" id="missionApp">
  <header class="topbar">
    <div class="brandline">
      <a class="back" href="index.html" aria-label="Voltar ao restaurante">‹</a>
      <div class="mark">H<span>★</span></div>
      <div><span class="kicker">O RESTAURANTE DA HANNA</span><h1>Missões da Chef</h1></div>

</div>
<div id="modal" class="modal-layer" hidden></div>
<script src="assets/food-art.js"></script>
