name: Publicar Cozinha da Hanna
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Verificar sintaxe do jogo
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const source = html.split('<script>')[1]?.split('</script>')[0];
          if (!source) throw new Error('JavaScript do jogo ausente');
          new vm.Script(source, {filename: 'cozinha-da-hanna.js'});
          const sprites = fs.readFileSync('assets/food-art.js', 'utf8');
          new vm.Script(sprites, {filename: 'food-art.js'});
          const voices = fs.readFileSync('assets/voice-engine.js', 'utf8');
          new vm.Script(voices, {filename:'voice-engine.js'});
          if (!html.includes('assets/voice-engine.js')) throw new Error('Motor de voz nao integrado');
          if (!fs.existsSync('assets/polish.css')) throw new Error('Estilos faltando');
          for (const id of ['pizza','sorvete','frutas','panqueca','burger']) {
            if (!sprites.includes(id + ':')) throw new Error('Arte não encontrada: ' + id);
          }
          if (!html.includes('assets/missions-data.js')) throw new Error('Missões não integradas ao restaurante');
          for (const name of ['startDrag','moveDrag','releaseDrag','plateHTML','renderPrepare']) {
            if (!source.includes(name)) throw new Error('Mecânica obrigatória ausente: ' + name);
          }
          new vm.Script(fs.readFileSync('assets/missions-data.js','utf8'), {filename:'missions-data.js'});
          const missionHtml = fs.readFileSync('missions.html','utf8');
          if (!missionHtml.includes('location.replace("./index.html"')) throw new Error('Página antiga de missões deve redirecionar');
          if (!source.includes('function missionMenu()') || !source.includes('function missionOrder(')) throw new Error('Progressão ausente do jogo original');
          console.log('Missões integradas ao jogo original, sem segundo jogo.');
          console.log('Sintaxe e estrutura do jogo verificadas.');
          NODE
      - name: Validar vozes e variações de frases
        run: node tests/voice-test.js
      - name: Testar pedidos, arrasto e sobremesas no Chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cozinha-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then echo "Chrome não encontrado"; exit 1; fi
          timeout 70s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8765/tests/smoke.html > /tmp/cozinha-smoke-result.html 2>/tmp/cozinha-chrome.log
          if ! grep -q "PASS: missões integradas" /tmp/cozinha-smoke-result.html; then
            echo "Teste do jogo falhou:"
            sed -n '/<pre id="result">/,/<\\/pre>/p' /tmp/cozinha-smoke-result.html | head -n 18 || true
            tail -n 12 /tmp/cozinha-chrome.log || true
            exit 1
          fi
          echo "Pedidos e progressão integrados aprovados no navegador."

      - name: Testar capítulos, gestos e progressão em Chrome
        run: |
          python3 -m http.server 8877 --bind 127.0.0.1 >/tmp/missions-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then echo "Chrome indisponivel"; exit 1; fi
          timeout 70s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --virtual-time-budget=18000 --dump-dom http://127.0.0.1:8877/tests/missions-smoke.html > /tmp/missions-result.html 2>/tmp/missions-chrome.log
          if ! grep -q "PASS: sem segundo jogo" /tmp/missions-result.html; then
            echo "Falhou a validacao das missoes:"
            sed -n '/<pre id="result">/,/<\/pre>/p' /tmp/missions-result.html | head -n 25 || true
            tail -n 10 /tmp/missions-chrome.log || true
            exit 1
          fi
          echo "Link antigo redireciona para o restaurante original."

      - name: Validar protótipo de hambúrguer no Chrome
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const path='prototype/burger/';
          const html=fs.readFileSync(path+'index.html','utf8');
          const js=fs.readFileSync(path+'burger.js','utf8');
          new vm.Script(js,{filename:'burger.js'});
          if(!html.includes('burger.css')||!html.includes('burger.js'))throw Error('Protótipo incompleto');
          if(!html.includes('../../assets/voice-engine.js'))throw Error('Voz do cliente não integrada');
          const original=fs.readFileSync('index.html','utf8');
          if(!original.includes('function missionMenu()'))throw Error('Restaurante original não preservado');
          NODE
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/burger-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then echo "Chrome não encontrado"; exit 1; fi
          timeout 75s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --virtual-time-budget=26000 --dump-dom http://127.0.0.1:8899/tests/burger-smoke.html > /tmp/burger-smoke-result.html 2>/tmp/burger-chrome.log
          if ! grep -q "PASS: hambúrguer visual 2.5D" /tmp/burger-smoke-result.html; then
            echo "Teste do hambúrguer falhou:"
            sed -n '/<pre id="result">/,/<\\/pre>/p' /tmp/burger-smoke-result.html | head -n 40 || true
            tail -n 18 /tmp/burger-chrome.log || true
            exit 1
          fi
          echo "Protótipo isolado: preparo, cortes, chapa, montagem, avaliação e responsividade aprovados."

  deploy:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o jogo
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos do jogo
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
