name: Publicar Cozinha da Hanna
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Verificar sintaxe do jogo
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const source = html.split('<script>')[1]?.split('</script>')[0];
          if (!source) throw new Error('JavaScript do jogo ausente');
          new vm.Script(source, {filename: 'cozinha-da-hanna.js'});
          const sprites = fs.readFileSync('assets/food-art.js', 'utf8');
          new vm.Script(sprites, {filename: 'food-art.js'});
          const voices = fs.readFileSync('assets/voice-engine.js', 'utf8');
          new vm.Script(voices, {filename:'voice-engine.js'});
          if (!html.includes('assets/voice-engine.js')) throw new Error('Motor de voz nao integrado');
          if (!fs.existsSync('assets/polish.css')) throw new Error('Estilos faltando');
          for (const id of ['pizza','sorvete','frutas','panqueca','burger']) {
            if (!sprites.includes(id + ':')) throw new Error('Arte não encontrada: ' + id);
          }
          if (!source.includes("S.course='dessert'")) throw new Error('Etapa de sobremesa ausente');
          for (const name of ['startDrag','moveDrag','releaseDrag','plateHTML','renderPrepare']) {
            if (!source.includes(name)) throw new Error('Mecânica obrigatória ausente: ' + name);
          }
          console.log('Sintaxe e estrutura do jogo verificadas.');
          NODE
      - name: Validar vozes e variações de frases
        run: node tests/voice-test.js
      - name: Testar pedidos, arrasto e sobremesas no Chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cozinha-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then echo "Chrome não encontrado"; exit 1; fi
          timeout 70s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8765/tests/smoke.html > /tmp/cozinha-smoke-result.html 2>/tmp/cozinha-chrome.log
          if ! grep -q "PASS: 8 preparos perfeitos" /tmp/cozinha-smoke-result.html; then
            echo "Teste do jogo falhou:"
            sed -n '/<pre id="result">/,/<\\/pre>/p' /tmp/cozinha-smoke-result.html | head -n 18 || true
            tail -n 12 /tmp/cozinha-chrome.log || true
            exit 1
          fi
          echo "Oito pratos montados com sucesso em navegador real."

  deploy:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o jogo
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos do jogo
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
